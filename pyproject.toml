[project]
name = "housing-api"
version = "0.1.0"
description = "Serverless California housing median-value prediction API"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.43.122",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
housing-api = "housing_api.local_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "training"]
extend-exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"training/train.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["housing_api"]
